# The site editor (Decap CMS), at /admin/.
# Every save is a draft: a pull request with its own preview link. Publish merges it
# and the live site updates in about a minute.

backend:
  name: github
  repo: sgordon1024/lssq-site
  branch: main
  # The sign-in helper in auth/. Replace this with its address once it's deployed.
  base_url: https://lssq-cms-auth.REPLACE-ME.workers.dev
  auth_scope: public_repo
  squash_merges: true
  # The preview workflow posts a status with this name and the preview's address.
  preview_context: deploy/preview

publish_mode: editorial_workflow
show_preview_links: true

# On localhost, edit the files on disk instead (run `npm run cms` alongside `npm start`).
local_backend: true

site_url: https://sgordon1024.github.io/lssq-site/
display_url: https://sgordon1024.github.io/lssq-site/
logo_url: ../brand/f-q.svg

media_folder: src/img/uploads
public_folder: /img/uploads

editor:
  preview: false

collections:
  - name: events
    label: Events
    label_singular: Event
    description: One page per event. Once an event's last day has passed, it moves to "Where we've been" on its own.
    folder: src/events
    create: true
    slug: "{{slug}}"
    identifier_field: title
    summary: "{{title}} ({{start}})"
    sortable_fields: [start, title]
    preview_path: "events/{{slug}}/"
    fields:
      - { label: Name, name: title, widget: string, hint: "Like Baja Weekend." }
      - label: First day
        name: start
        widget: datetime
        format: YYYY-MM-DD
        date_format: MMM D, YYYY
        time_format: false
        picker_utc: true
      - label: Last day
        name: end
        widget: datetime
        format: YYYY-MM-DD
        date_format: MMM D, YYYY
        time_format: false
        picker_utc: true
        required: false
        hint: Leave empty for a one-day event.
      - label: Arrive from
        name: arrive
        widget: datetime
        format: HH:mm
        date_format: false
        time_format: h:mm A
        required: false
        hint: When people can roll in on the first day. The countdown runs to this. Leave empty for noon.
      - { label: Where, name: place, widget: string, hint: "Short, like: On the coast, south of Ensenada." }
      - { label: Region, name: region, widget: string, required: false, hint: "Like: Baja California, Mexico." }
      - { label: One-line summary, name: summary, widget: string, hint: "Shows on the events list." }
      - label: Highlights
        name: highlights
        widget: list
        required: false
        max: 4
        hint: Two to four short things people will do, like Morning yoga. They show on the photo cards.
        field: { label: Highlight, name: highlight, widget: string }
      - { label: Photo, name: photo, widget: image, required: false, choose_url: false, hint: "Wide photos work best. One from a past weekend is even better." }
      - { label: Photo description, name: photoAlt, widget: string, required: false, hint: "What's in the photo, for people who can't see it." }
      - { label: Photo credit, name: photoCredit, widget: string, required: false, hint: "Who took it, like: Photo by Sam. Shows small on the photo." }
      - label: Chat link
        name: chat
        widget: string
        required: false
        hint: The WhatsApp group invite link. Leave empty until it's ready.
        pattern: ["^(https://.*)?$", "Paste the full link, starting with https://"]
      - label: Coordinates
        name: coords
        widget: string
        required: false
        hint: "The exact spot, like 31.7246, -116.7196. In Google Maps, press and hold the spot to copy them. Until you add these, the page says the spot is a secret and when it drops."
        pattern: ["^(\\s*-?\\d{1,2}(\\.\\d+)?\\s*,\\s*-?\\d{1,3}(\\.\\d+)?\\s*)?$", "Two numbers with a comma between, like 31.7246, -116.7196"]
      - { label: Directions, name: directions, widget: text, required: false, hint: "Anything the map won't tell people, like: The last stretch is a dirt road." }
      - label: Spot drops on
        name: reveal
        widget: datetime
        format: YYYY-MM-DD
        date_format: MMM D, YYYY
        time_format: false
        picker_utc: true
        required: false
        hint: When you expect to share the coordinates. Leave empty and the page guesses 30 days before the first day.
      - label: What to bring
        name: bring
        widget: list
        required: false
        field: { label: Item, name: item, widget: string }
      - label: About this event
        name: body
        widget: markdown
        modes: [rich_text]
        buttons: [bold, italic, link, bulleted-list]
        editor_components: []
      - { label: Made-up sample, name: sample, widget: boolean, default: false, required: false, hint: "Leave this off for real events." }

  - name: site
    label: Site words
    description: The words on the home, story and contact pages.
    files:
      - name: words
        label: Home, story and contact pages
        file: src/_data/site.json
        fields:
          - { label: Tagline, name: tagline, widget: string, hint: "Shows in the footer." }
          - label: Top of the home page
            name: hero
            widget: object
            collapsed: false
            fields:
              - { label: Small label, name: label, widget: string }
              - { label: Headline, name: headline, widget: string }
              - { label: Text, name: text, widget: text }
          - label: What is LSSQ
            name: about
            widget: object
            fields:
              - { label: Headline, name: headline, widget: string }
              - { label: Text, name: text, widget: text }
              - label: Pillars
                name: pillars
                widget: list
                allow_add: false
                summary: "{{fields.name}}"
                fields:
                  - { label: Name, name: name, widget: string }
                  - { label: Text, name: text, widget: string }
                  - label: Icon
                    name: icon
                    widget: select
                    options:
                      - { label: Sun, value: sun }
                      - { label: Die, value: die }
                      - { label: Music notes, value: notes }
                      - { label: Heart, value: heart }
          - label: Photos from past weekends
            name: gallery
            widget: list
            hint: The first two show next to the next event on the home page.
            summary: "{{fields.alt}}"
            fields:
              - { label: Photo, name: photo, widget: image, choose_url: false }
              - { label: Photo description, name: alt, widget: string }
          - label: Our story page
            name: story
            widget: object
            fields:
              - { label: Headline, name: headline, widget: string }
              - { label: Text, name: text, widget: text }
              - { label: Big photo, name: photo, widget: image, required: false, choose_url: false }
              - { label: Photo description, name: photoAlt, widget: string, required: false }
              - { label: Photo credit, name: photoCredit, widget: string, required: false }
              - label: Chapters
                name: chapters
                widget: list
                summary: "{{fields.title}}"
                fields:
                  - { label: Title, name: title, widget: string }
                  - { label: Text, name: text, widget: text }
                  - { label: Photo, name: photo, widget: image, required: false, choose_url: false }
                  - { label: Photo description, name: photoAlt, widget: string, required: false }
                  - { label: Photo credit, name: photoCredit, widget: string, required: false }
          - label: Donate
            name: donate
            widget: object
            fields:
              - { label: Headline, name: headline, widget: string }
              - { label: Text, name: text, widget: text }
              - label: Ways to give
                name: links
                widget: list
                summary: "{{fields.label}}"
                fields:
                  - { label: Name, name: label, widget: string, hint: "Like Patreon." }
                  - { label: Link, name: url, widget: string, pattern: ["^https://", "Paste the full link, starting with https://"] }
          - label: Contact page
            name: contact
            widget: object
            fields:
              - { label: Headline, name: headline, widget: string }
              - { label: Text, name: text, widget: text }
              - { label: Email, name: email, widget: string, required: false, hint: "Leave empty to hide the email button." }
              - { label: Instagram link, name: instagram, widget: string }
